<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Have a Nice Day</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #f4f4f4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      -webkit-tap-highlight-color: transparent;
    }
    .loader {
      position: fixed; inset: 0; z-index: 2;
      display: grid; place-content: center; justify-items: center; gap: 18px;
      padding: 24px;
      background: #f4f4f4;
      animation: fadeAway .65s ease-in 2.55s forwards;
    }
    .label { font-size: clamp(11px, 3vw, 14px); letter-spacing: .22em; color: #222; }
    .track { width: min(72vw, 320px); height: 5px; background: #d2d2d2; overflow: hidden; }
    .progress {
      width: 0; height: 100%; background: #111;
      animation: load 2.45s cubic-bezier(.2,.75,.25,1) forwards;
    }
    .scene {
      position: fixed; inset: 0; display: grid; place-items: end center;
      padding-bottom: max(8vh, 40px);
      background: #050505; opacity: 0;
      animation: reveal .7s ease-out 2.9s forwards;
    }
    .emoji {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-size: clamp(150px, 48vw, 340px);
      line-height: 1; display: block;
      transform: translateY(120vh) rotate(-8deg);
      filter: drop-shadow(0 10px 25px rgba(255,255,255,.06));
      animation: rise 1.15s cubic-bezier(.16,.82,.25,1) 3.05s forwards;
      user-select: none;
    }
    @keyframes load { to { width: 100%; } }
    @keyframes fadeAway { to { opacity: 0; visibility: hidden; } }
    @keyframes reveal { to { opacity: 1; } }
    @keyframes rise {
      0% { transform: translateY(120vh) rotate(-8deg); }
      72% { transform: translateY(-3vh) rotate(3deg); }
      86% { transform: translateY(1vh) rotate(-1deg); }
      100% { transform: translateY(0) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress { animation-duration: .1s; }
      .loader { animation-delay: .1s; }
      .scene { animation-delay: .2s; }
      .emoji { animation-delay: .2s; animation-duration: .4s; }
    }
  </style>
</head>
<body>
  <main aria-label="Loading animation">
    <section class="loader" aria-label="Loading">
      <div class="label">PLEASE WAIT</div>
      <div class="track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
        <div class="progress"></div>
      </div>
    </section>
    <section class="scene" aria-label="Surprise">
      <span class="emoji" role="img" aria-label="Middle finger">🖕</span>
    </section>
  </main>
</body>
</html>
